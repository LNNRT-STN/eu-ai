  </g>
  <g id="text_23">
   <text style="font-size: 10px; font-family: 'Helvetica Neue', 'Arial', 'DejaVu Sans', sans-serif; text-anchor: start; fill: #5b6577" x="18" y="54.16" transform="rotate(-0 18 54.16)">Residents of the 100-year zone by shelter outcome, per area</text>
  </g>
  <g id="text_24">
   <text style="font-size: 7.5px; font-family: 'Helvetica Neue', 'Arial', 'DejaVu Sans', sans-serif; fill: #5b6577" transform="translate(18 279.18)">Vesdre valley counted in the Liège area. Shelters are candidates (schools, sports halls, civic buildings dry in the 100-year zone),</text>
   <text style="font-size: 7.5px; font-family: 'Helvetica Neue', 'Arial', 'DejaVu Sans', sans-serif; fill: #5b6577" transform="translate(18 293.025234)">not official; 1.5 km walk, 4 m² per person.</text>
   <text style="font-size: 7.5px; font-family: 'Helvetica Neue', 'Arial', 'DejaVu Sans', sans-serif; fill: #5b6577" transform="translate(18 306.993516)">Source: EFAS flood hazard maps (JRC), GHS-OBAT, GHS-POP 2020 (challenge data); OpenStreetMap. Team analysis. Zones are modelled with no dikes or</text>
   <text style="font-size: 7.5px; font-family: 'Helvetica Neue', 'Arial', 'DejaVu Sans', sans-serif; fill: #5b6577" transform="translate(18 321.12)">flood walls, so towns behind them (Liège, Venlo) are an upper bound. Residents are an order of magnitude.</text>
  </g>
