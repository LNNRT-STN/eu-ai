  </g>
  <g id="text_16">
   <text style="font-size: 7.5px; font-family: 'Helvetica Neue', 'Arial', 'DejaVu Sans', sans-serif; fill: #8a8984" transform="translate(14.4 296.493984)">* Liège, Rochefort, Venlo, Eschweiler, Wassenberg, Euskirchen-Rheinbach. Vesdre modelled, not in the total.</text>
   <text style="font-size: 7.5px; font-family: 'Helvetica Neue', 'Arial', 'DejaVu Sans', sans-serif; fill: #8a8984" transform="translate(14.4 309.45375)">Shelters are candidates (schools, sports halls, civic buildings dry in 2021), not official; 1.5 km walk, 4 m² per person.</text>
   <text style="font-size: 7.5px; font-family: 'Helvetica Neue', 'Arial', 'DejaVu Sans', sans-serif; fill: #8a8984" transform="translate(14.4 322.56)">Source: Copernicus EMS, EFAS, GHS-OBAT, GHS-POP 2020 (challenge data); OpenStreetMap. Team analysis. Residents are an order of magnitude.</text>
  </g>
