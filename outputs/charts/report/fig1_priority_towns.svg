   <text style="font-size: 7.5px; font-family: 'Helvetica Neue', 'Arial', 'DejaVu Sans', sans-serif; fill: #5b6577" transform="translate(18 307.132383)">Shelters: schools, sports halls, town halls that stayed dry; candidates, not official. Central estimate; residents are an order of magnitude.</text>
