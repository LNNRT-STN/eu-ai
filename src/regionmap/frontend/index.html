<!doctype html><html><head><meta charset="utf-8">
<title>Region map</title>
<link href="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.css" rel="stylesheet">
<script src="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.js"></script>
<style>
html,body{margin:0;height:100%;font:13px/1.35 "Source Sans Pro",system-ui,sans-serif;background:#e8eef5}
#m{position:absolute;inset:0;border-radius:12px;overflow:hidden}
.pin{cursor:pointer}
.pin b{display:block;background:rgba(255,255,255,.96);color:#1d1d1f;padding:3px 8px;border-radius:6px;font-weight:600;
  white-space:nowrap;box-shadow:0 1px 2px rgba(0,0,0,.18),0 2px 8px rgba(0,0,0,.08)}
.pin b span{font-weight:400;color:#4f6580}
.pin b em{font-style:normal;font-weight:700;text-transform:uppercase;font-size:11px;letter-spacing:.02em;margin-right:4px}
.pin.evacuate b em{color:#d70015}.pin.warn b em{color:#a85400}.pin.watch b em{color:#7a5d00}.pin.none b em{color:#4f6580}
.pin.sel b{outline:2px solid #1d1d1f}
body.far .pin.none:not(.sel) b,body.far .pin.watch:not(.sel) b,body.far .pin.minor:not(.sel) b{display:none}
body.far .pin b em{display:none}
body.far .bar b{display:none}
body.near .pin b{display:none}
.pin.evacuate b{background:#d70015;color:#fff}.pin.evacuate b em{color:#fff}.pin.evacuate b span{color:#ffe1e3}
.pin.hid b{display:none}
.bar{display:flex;align-items:center;gap:4px;pointer-events:none}
.bar s{width:12px;height:12px;border-radius:50%;background:#d70015;border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.bar b{background:#d70015;color:#fff;font-size:11px;font-weight:700;padding:1px 6px;border-radius:5px;
  box-shadow:0 1px 3px rgba(0,0,0,.25);white-space:nowrap}
.mode{position:absolute;top:10px;left:10px;z-index:3;display:flex;gap:2px;padding:2px;border-radius:9px;
  background:#e5e5ea;box-shadow:0 1px 4px rgba(0,0,0,.22)}
.mode button{border:0;background:transparent;font:inherit;font-size:12px;font-weight:600;color:#3a3a3c;
  padding:4px 11px;border-radius:7px;cursor:pointer}
.mode button[aria-pressed=true]{background:#fff;color:#1d1d1f;box-shadow:0 1px 2px rgba(0,0,0,.18)}
.mode button:focus-visible{outline:2px solid #0071e3;outline-offset:1px}
</style></head><body><div id="m"></div>
<div class="mode" role="group" aria-label="Map style">
  <button type="button" data-mode="map" aria-pressed="true">Map</button>
  <button type="button" data-mode="sat" aria-pressed="false">Satellite 3D</button>
</div>
<script>
// ---- Streamlit component protocol (v1), by hand: see streamlit/static ComponentInstance.js ----
const send = (type, data) => parent.postMessage(Object.assign({isStreamlitMessage: true, type}, data), "*");
let clicks = 0, lastH = null;
const select = m => send("streamlit:setComponentValue", {value: {selected: m, clicks: ++clicks}, dataType: "json"});

const STATUS = {none: "#8e8e93", watch: "#f2c94c", warn: "#f2994a", evacuate: "#d70015"};
const WORD = {none: "No alert", watch: "Watch", warn: "Warn", evacuate: "Evacuate"};
const RANK = {none: 0, watch: 1, warn: 2, evacuate: 3};
const OVERVIEW = [4.97, 50.05, 7.3, 51.45];  // fallback: Rochefort - Venlo - Ahr (all ten areas)
const NONE = ["boolean", false];
const EMPTY = {type: "FeatureCollection", features: []};
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const fmt = n => n == null ? null : Math.round(n).toLocaleString("en-GB");

let map = null, ready = false, pending = null, prev = {};
const pins = new Map(), bars = new Map();
let floodSig = null, closSig = null, routeSig = null, areaSig = null, homeSig = null, cur = null;  // cur = municipality the camera is on (or null)
let bounds = null;  // [w, s, e, n] of every town and all the water: the "whole region" view
// "map": flat light basemap, status colours read best (default). "sat": Sentinel-2 imagery on 3D terrain.
let mode = "map";
try { if (localStorage.getItem("regionmap.mode") === "sat") mode = "sat"; } catch (e) {}
const flat = () => mode === "map";

function extent(towns, fc) {
  let w = 180, s = 90, e = -180, n = -90;
  const add = c => { if (c[0] < w) w = c[0]; if (c[0] > e) e = c[0]; if (c[1] < s) s = c[1]; if (c[1] > n) n = c[1]; };
  const walk = c => typeof c[0] === "number" ? add(c) : c.forEach(walk);
  for (const t of towns) if (t.lon != null && t.lat != null) add([t.lon, t.lat]);
  for (const f of (fc && fc.features) || []) if (f.geometry) walk(f.geometry.coordinates);
  return w < e ? [w, s, e, n] : null;
}

function overviewCam(d, animate) {
  const b = d.overview || bounds || OVERVIEW;
  // top padding clears the Map / Satellite switch; right leaves room for the labels of the eastern (Ahr) towns
  const c = map.cameraForBounds([[b[0], b[1]], [b[2], b[3]]], {padding: {top: 48, bottom: 28, left: 28, right: 150}});
  const opt = {center: c.center, zoom: c.zoom, pitch: flat() ? 0 : 45, bearing: 0};
  animate ? map.flyTo(Object.assign(opt, {duration: 2200})) : map.jumpTo(opt);
}
function townCam(t, animate) {
  const opt = flat() ? {center: [t.lon, t.lat], zoom: 13, pitch: 0, bearing: 0}
                     : {center: [t.lon, t.lat], zoom: 13.5, pitch: 60, bearing: -15};
  animate ? map.flyTo(Object.assign(opt, {duration: 2500, essential: true})) : map.jumpTo(opt);
}
function goTo(m, d, animate) {
  cur = m;
  const t = m && (d.towns || []).find(x => x.municipality === m);
  t ? townCam(t, animate) : overviewCam(d, animate);
}

// CARTO Positron (vector, keyless; the basemap the pydeck maps use). Its fills and lines go under the water, its
// place names over it. Unreachable: the map still draws, with the satellite view only.
const POSITRON = "https://basemaps.cartocdn.com/gl/positron-gl-style/style.json";
let baseIds = [];

function create() {
  fetch(POSITRON).then(r => r.ok ? r.json() : null).catch(() => null).then(p => build(p));
}

function build(p) {
  const own = {version: 8, sources: {
        img: {type: "raster", tileSize: 256, maxzoom: 15,
          tiles: ["https://tiles.maps.eox.at/wmts/1.0.0/s2cloudless-2021_3857/default/g/{z}/{y}/{x}.jpg"],
          attribution: '<a href="https://s2maps.eu" target="_blank">Sentinel-2 cloudless 2021</a> by EOX IT Services GmbH (modified Copernicus Sentinel data 2021), CC BY-NC-SA 4.0'},
        dem: {type: "raster-dem", encoding: "terrarium", tileSize: 256, maxzoom: 15,
          tiles: ["https://s3.amazonaws.com/elevation-tiles-prod/terrarium/{z}/{x}/{y}.png"],
          attribution: 'Terrain: <a href="https://registry.opendata.aws/terrain-tiles/" target="_blank">AWS Terrain Tiles</a> (Mapzen; SRTM, EU-DEM and others)'},
        hs: {type: "raster-dem", encoding: "terrarium", tileSize: 256, maxzoom: 15,
          tiles: ["https://s3.amazonaws.com/elevation-tiles-prod/terrarium/{z}/{x}/{y}.png"]},
        areas: {type: "geojson", data: EMPTY},
        homes: {type: "geojson", data: EMPTY},
        flood: {type: "geojson", data: EMPTY},
        routes: {type: "geojson", data: EMPTY},
        closures: {type: "geojson", data: EMPTY}},
      layers: [{id: "img", type: "raster", source: "img"},
        {id: "hs", type: "hillshade", source: "hs", paint: {"hillshade-exaggeration": 0.25, "hillshade-shadow-color": "#1d1d1f"}},
        {id: "area-fill", type: "fill", source: "areas", paint: {"fill-color": "#8e8e93", "fill-opacity": 0}},
        {id: "area-edge", type: "line", source: "areas", paint: {"line-color": "#4f6580", "line-width": 0.8, "line-opacity": 0.5}},
        // return-period zones are nested: features come widest first, so the rarer flood shows as a lighter rim
        {id: "flood-fill", type: "fill", source: "flood", paint: {"fill-color": ["match", ["coalesce", ["get", "rp"], 0],
          500, "#9db9ec", 100, "#3f6fd1", "#0b3d91"], "fill-opacity": 0.55}},
        {id: "flood-edge", type: "line", source: "flood", paint: {"line-color": "#ffffff", "line-width": 1, "line-opacity": 0.7}},
        {id: "flood-edge-modelled", type: "line", source: "flood", filter: NONE,
          paint: {"line-color": "#ffffff", "line-width": 1.6, "line-dasharray": [3, 2]}},
        {id: "area-sel", type: "line", source: "areas", filter: NONE,
          paint: {"line-color": "#1d1d1f", "line-width": 2.5}},
        {id: "homes", type: "circle", source: "homes",
          paint: {"circle-radius": ["interpolate", ["linear"], ["zoom"], 10, 2.5, 15, ["match", ["get", "s"], "needs help", 7, 4.5]],
            "circle-color": ["match", ["get", "s"], "needs help", "#d70015", "safe", "#248a3d", "#f2994a"],
            "circle-stroke-color": "#ffffff", "circle-stroke-width": ["interpolate", ["linear"], ["zoom"], 12, 0, 14, 1]}},
        // evacuation roads: blue, wider with the people who take them; the stretches inside the flood zone
        // dashed orange (leave before the river rises); closed roads red. Region view: hairlines; town view: bold.
        {id: "route-case", type: "line", source: "routes", layout: {"line-cap": "round", "line-join": "round"},
          paint: {"line-color": "#ffffff", "line-opacity": ["interpolate", ["linear"], ["zoom"], 9, 0, 11, 0.95],
            "line-width": ["interpolate", ["linear"], ["zoom"], 9, 2, 12, ["+", 4, ["*", 4, ["min", 1, ["/", ["get", "people"], 3000]]]], 15, ["+", 7, ["*", 6, ["min", 1, ["/", ["get", "people"], 3000]]]]]}},
        {id: "route-line", type: "line", source: "routes", filter: ["!", ["get", "flooded"]],
          layout: {"line-cap": "round", "line-join": "round"},
          paint: {"line-color": "#0071e3", "line-opacity": ["interpolate", ["linear"], ["zoom"], 8.5, 0.6, 11, 1],
            "line-width": ["interpolate", ["linear"], ["zoom"], 9, 1, 12, ["+", 2, ["*", 3, ["min", 1, ["/", ["get", "people"], 3000]]]], 15, ["+", 4, ["*", 5, ["min", 1, ["/", ["get", "people"], 3000]]]]]}},
        {id: "route-flooded", type: "line", source: "routes", filter: ["get", "flooded"],
          layout: {"line-join": "round"},
          paint: {"line-color": "#c93400", "line-opacity": ["interpolate", ["linear"], ["zoom"], 8.5, 0.6, 11, 1],
            "line-dasharray": [2, 1.2],
            "line-width": ["interpolate", ["linear"], ["zoom"], 9, 1, 12, ["+", 2, ["*", 3, ["min", 1, ["/", ["get", "people"], 3000]]]], 15, ["+", 4, ["*", 5, ["min", 1, ["/", ["get", "people"], 3000]]]]]}},
        {id: "closure-case", type: "line", source: "closures", filter: ["==", ["geometry-type"], "LineString"],
          layout: {"line-cap": "round"}, paint: {"line-color": "#ffffff",
            "line-width": ["interpolate", ["linear"], ["zoom"], 9, 4, 14, 11]}},
        {id: "closure-line", type: "line", source: "closures", filter: ["==", ["geometry-type"], "LineString"],
          layout: {"line-cap": "round"}, paint: {"line-color": "#d70015",
            "line-width": ["interpolate", ["linear"], ["zoom"], 9, 2.5, 14, 7]}}]};
  let style = own;
  if (p) {
    const under = p.layers.filter(l => l.type !== "symbol"), names = p.layers.filter(l => l.type === "symbol");
    baseIds = p.layers.map(l => l.id);
    const at = own.layers.findIndex(l => l.id === "flood-edge");
    style = Object.assign({}, p, {sources: Object.assign({}, p.sources, own.sources),
      layers: [...under, ...own.layers.slice(0, at), ...names, ...own.layers.slice(at)]});
  }
  map = new maplibregl.Map({
    container: "m", hash: false, maxPitch: 80, center: [6.3, 50.6], zoom: 8.5, style,
    attributionControl: {compact: true}
  });
  map.addControl(new maplibregl.NavigationControl({visualizePitch: true}), "top-right");
  map.addControl(new maplibregl.ScaleControl({unit: "metric"}), "bottom-right");
  // far: the region, only the larger towns named; near: inside one town, its homes speak, the labels step aside
  const far = () => { document.body.classList.toggle("far", map.getZoom() < 11);
                      document.body.classList.toggle("near", map.getZoom() >= 12.5); };
  map.on("zoomend", far); far();
  // Credits are printed under the map; keep the compact "i" button closed so it does not cover the bottom edge.
  map.on("load", () => document.querySelectorAll(".maplibregl-ctrl-attrib").forEach(e => e.classList.remove("maplibregl-compact-show")));
  map.on("moveend", declutter);
  map.on("click", "area-fill", e => {
    const m = e.features[0] && e.features[0].properties.municipality;
    if (m) { goTo(m, prev, true); paintSel(m); select(m); }
  });
  map.on("mouseenter", "area-fill", () => map.getCanvas().style.cursor = "pointer");
  map.on("mouseleave", "area-fill", () => map.getCanvas().style.cursor = "");
  map.once("style.load", () => {
    if (map.setSky) map.setSky({"sky-color": "#a9c8ee", "horizon-color": "#e8eef5", "fog-color": "#e8eef5",
      "sky-horizon-blend": 0.6, "horizon-fog-blend": 0.6, "fog-ground-blend": 0.2});
    applyMode();
    const at = document.querySelector(".maplibregl-ctrl-attrib");  // start folded: the page caption credits the sources
    if (at) at.classList.remove("maplibregl-compact-show");
    ready = true;
    const d = pending; pending = null; update(d, true);
  });
}

// Layers, terrain and edge colours for the current mode. White edges read on imagery, not on a light map.
function applyMode() {
  const vis = (id, on) => map.setLayoutProperty(id, "visibility", on ? "visible" : "none");
  baseIds.forEach(id => vis(id, flat())); vis("img", !flat());
  map.setPaintProperty("hs", "hillshade-exaggeration", flat() ? 0.12 : 0.25);
  map.setPaintProperty("hs", "hillshade-shadow-color", flat() ? "#8e8e93" : "#1d1d1f");
  const edge = flat() ? "#0b3d91" : "#ffffff";
  map.setPaintProperty("flood-edge", "line-color", edge);
  map.setPaintProperty("flood-edge", "line-opacity", flat() ? 0.35 : 0.7);
  map.setPaintProperty("flood-edge-modelled", "line-color", edge);
  map.setPaintProperty("flood-edge-modelled", "line-opacity", flat() ? 0.75 : 1);
  map.setTerrain(flat() ? null : {source: "dem", exaggeration: 1.5});
  map.setMaxPitch(flat() ? 0 : 80);
  flat() ? map.dragRotate.disable() : map.dragRotate.enable();
  flat() ? map.touchZoomRotate.disableRotation() : map.touchZoomRotate.enableRotation();
  document.querySelectorAll(".mode button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.mode === mode)));
  // new credits unfold the compact "i" box; fold it again (the page caption credits the sources)
  map.once("idle", () => document.querySelectorAll(".maplibregl-ctrl-attrib").forEach(e => e.classList.remove("maplibregl-compact-show")));
}
function setMode(m) {
  if (m === mode) return;
  mode = m;
  try { localStorage.setItem("regionmap.mode", m); } catch (e) {}
  if (!ready) return;
  applyMode();
  if (flat()) map.easeTo({pitch: 0, bearing: 0, duration: 600});
  else map.easeTo({pitch: cur ? 60 : 45, bearing: cur ? -15 : 0, duration: 900});
}
document.querySelectorAll(".mode button").forEach(b => b.addEventListener("click", () => setMode(b.dataset.mode)));
document.querySelectorAll(".mode button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.mode === mode)));

function paintSel(m) {
  map.setFilter("area-sel", m ? ["==", ["get", "municipality"], m] : NONE);
  let ch = false;
  pins.forEach((p, k) => { if (p.el.classList.contains("sel") !== (k === m)) { p.el.classList.toggle("sel", k === m); ch = true; } });
  if (ch) requestAnimationFrame(declutter);
}

function updatePins(towns, sel) {
  const seen = new Set();
  let changed = false;
  for (const t of towns) {
    const k = t.municipality; seen.add(k);
    let p = pins.get(k);
    if (!p) {
      const el = document.createElement("div");
      el.addEventListener("click", ev => { ev.stopPropagation(); goTo(k, prev, true); paintSel(k); select(k); });
      p = {el, marker: new maplibregl.Marker({element: el, anchor: "center"}).setLngLat([t.lon, t.lat]).addTo(map), html: ""};
      pins.set(k, p);
    }
    const st = STATUS[t.status] ? t.status : "none";
    const n = fmt(t.people);  // people in the planned flood zone
    const html = "<b><em>" + WORD[st] + "</em>" + esc(t.label || k) + (n != null && st !== "none" ? " <span>" + n + " people</span>" : "") + "</b>";
    if (p.html !== html) { p.el.innerHTML = html; p.html = html; }  // touch the DOM only on change
    // classList, not className: MapLibre keeps its own marker classes on this element
    p.el.classList.add("pin");
    p.el.classList.toggle("minor", (t.people || 0) < 300);  // small towns: label only when zoomed in
    for (const x in STATUS) if (p.el.classList.contains(x) !== (x === st)) p.el.classList.toggle(x, x === st);
    if (p.el.classList.contains("sel") !== (k === sel)) { p.el.classList.toggle("sel", k === sel); changed = true; }
    p.el.title = (t.label || k) + ": " + WORD[st] + ". " + fmt(t.people) + " people in the flood zone" + (t.modelled ? " (modelled area)" : "");
    p.el.style.zIndex = String(10 + RANK[st]);
    if (p.rank !== RANK[st]) { p.rank = RANK[st]; changed = true; }
    p.people = t.people || 0;
    const ll = p.marker.getLngLat();
    if (ll.lng !== t.lon || ll.lat !== t.lat) p.marker.setLngLat([t.lon, t.lat]);
  }
  for (const [k, p] of pins) if (!seen.has(k)) { p.marker.remove(); pins.delete(k); changed = true; }
  if (changed) requestAnimationFrame(declutter);
}

// Hide labels that would cover a more urgent (then more populous) town's label; the dot and its tooltip stay.
function declutter() {
  const order = [...pins.values()].sort((a, b) => (b.el.classList.contains("sel") - a.el.classList.contains("sel"))
    || (b.rank - a.rank) || (b.people - a.people));
  const shown = [];
  for (const p of order) {
    p.el.classList.remove("hid");
    const lab = p.el.querySelector("b");
    if (!lab || getComputedStyle(lab).display === "none") continue;
    const r = lab.getBoundingClientRect();
    const box = {l: r.left - 2, t: r.top - 2, r: r.right + 2, b: r.bottom + 2};
    if (shown.some(o => box.l < o.r && box.r > o.l && box.t < o.b && box.b > o.t)) p.el.classList.add("hid");
    else shown.push(box);
  }
}

function updateWater(towns) {
  const by = {};  // one status per municipality (the worst, if a name repeats across areas)
  for (const t of towns) {
    const s = STATUS[t.status] ? t.status : "none";
    if (!(t.municipality in by) || RANK[s] > RANK[by[t.municipality].s]) by[t.municipality] = {s, mod: !!t.modelled};
  }
  const keys = Object.keys(by);
  const color = keys.length ? ["match", ["get", "municipality"]] : null, op = keys.length ? ["match", ["get", "municipality"]] : null;
  const OP = {none: 0.04, watch: 0.28, warn: 0.36, evacuate: 0.42};
  const near = op && ["match", ["get", "municipality"]];
  for (const k of keys) { color.push(k, STATUS[by[k].s]); op.push(k, OP[by[k].s]); near.push(k, OP[by[k].s] / 5); }
  map.setPaintProperty("area-fill", "fill-color", color ? color.concat(["#8e8e93"]) : "#8e8e93");
  // strong across the region, faint inside a town so its streets and homes stay readable
  map.setPaintProperty("area-fill", "fill-opacity", op ? ["interpolate", ["linear"], ["zoom"], 9.5, op.concat([0.04]),
                                                          11, near.concat([0.01]), 12, 0.02] : 0.04);
  const mod = keys.filter(k => by[k].mod);
  const inMod = ["in", ["get", "municipality"], ["literal", mod]];
  map.setFilter("flood-edge-modelled", inMod);
  map.setFilter("flood-edge", ["!", inMod]);
}

function lineMid(g) {
  const c = g.type === "LineString" ? g.coordinates : g.coordinates[0];
  return c[Math.floor(c.length / 2)];
}
function updateClosures(fc) {
  const sig = JSON.stringify(fc || null);
  if (sig === closSig) return;
  closSig = sig;
  map.getSource("closures").setData(fc || EMPTY);
  const seen = new Set();
  for (const f of (fc && fc.features) || []) {
    const g = f.geometry; if (!g) continue;
    const at = g.type === "Point" ? g.coordinates : lineMid(g);
    const k = at.join(","); seen.add(k);
    if (!bars.has(k)) {
      const el = document.createElement("div"); el.className = "bar";
      el.title = (f.properties && f.properties.name ? f.properties.name + ": " : "") + "road closed";
      el.innerHTML = "<s></s><b>" + (f.properties && f.properties.name ? esc(f.properties.name) + " · " : "") + "closed</b>";
      bars.set(k, new maplibregl.Marker({element: el, anchor: "left"}).setLngLat(at).addTo(map));
    }
  }
  for (const [k, mk] of bars) if (!seen.has(k)) { mk.remove(); bars.delete(k); }
}

function update(d, first) {
  const towns = d.towns || [];
  const fsig = d.flood ? (d.flood.features || []).length + ":" + JSON.stringify(d.flood).length : "0";
  if (fsig !== floodSig) { floodSig = fsig; map.getSource("flood").setData(d.flood || EMPTY); bounds = null; }
  const asig = d.areas ? (d.areas.features || []).length : 0;
  if (asig !== areaSig) { areaSig = asig; map.getSource("areas").setData(d.areas || EMPTY); }
  if (!bounds) bounds = extent(towns, d.flood);
  updateWater(towns);
  updateClosures(d.closures);
  const rsig = d.routes ? JSON.stringify(d.routes).length + ":" + (d.routes.features || []).length : "0";
  if (rsig !== routeSig) { routeSig = rsig; map.getSource("routes").setData(d.routes || EMPTY); }
  const sel = d.selected || null;
  // Fly only when Python changes `selected` (and the camera is not already there): a user click flies at once,
  // and a page that never echoes the selection back does not yank the camera home on its next rerun.
  if (first) goTo(sel, d, false);
  else if (sel !== (prev.selected || null) && sel !== cur) goTo(sel, d, true);
  const s = first || sel !== (prev.selected || null) ? sel : cur;
  updatePins(towns, s);
  paintSel(s);
  const hsig = d.homes ? JSON.stringify(d.homes).length + ":" + (d.homes.features || []).length + ":" + (d.homes.sig || "") : "0";
  if (hsig !== homeSig) {
    const fresh = (d.homes && d.homes.features || []).length && !(prev.homes && prev.homes.features || []).length;
    homeSig = hsig; map.getSource("homes").setData(d.homes || EMPTY);
    // a town just opened: frame its homes, not its centre point
    const b = fresh && (d.selected || null) === cur && extent([], d.homes);
    if (b) map.fitBounds([[b[0], b[1]], [b[2], b[3]]], {padding: 48, maxZoom: 15.5, duration: 1200,
                                                         pitch: flat() ? 0 : 60, bearing: flat() ? 0 : -15});
  }
  const cam = d.camera ? JSON.stringify(d.camera) : null;
  if (cam && cam !== (prev.camera ? JSON.stringify(prev.camera) : null)) {
    const c = d.camera, o = {duration: first ? 0 : 2500};
    ["center", "zoom", "pitch", "bearing"].forEach(k => { if (c[k] != null) o[k] = c[k]; });
    if (flat()) { o.pitch = 0; o.bearing = 0; }
    first ? map.jumpTo(o) : map.flyTo(o);
  }
  prev = d;
}

window.addEventListener("message", ev => {
  const m = ev.data;
  if (!m || m.type !== "streamlit:render") return;

  if (!ready) { pending = d; return; }
  update(d, false);
});
